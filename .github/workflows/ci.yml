name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v test_behavior
      - run: python -m compileall -q .
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: |
          python -m venv /tmp/installed-check
          /tmp/installed-check/bin/python -m pip install --no-deps dist/*.whl
          python verify_installed.py /tmp/installed-check/bin/python
